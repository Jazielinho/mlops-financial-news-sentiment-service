services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000

    volumes:
      - ./mlruns:/app/mlruns
      - ./mlartifacts:${PWD}/mlartifacts

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
