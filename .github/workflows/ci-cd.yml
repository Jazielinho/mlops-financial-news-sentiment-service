name: test-and-deploy

on:
  push:
    branches: [main]

defaults:
  run:
    working-directory: starter

# Required AWS resources:
# 1. An ECR repository named finbert-api to store your Docker images
# 2. An ECS cluster named finbert-cluster
# 3. An ECS service named finbert-api-service running on that cluster
# 4. An ECS task definition named finbert-api
# Also add AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN,
# AWS_REGION, and ECR_REGISTRY as GitHub repository secrets.
env:
  ECR_REPOSITORY: finbert-api
  TASK_DEFINITION: finbert-api
  CONTAINER_NAME: finbert-api
  ECS_SERVICE: finbert-api-service
  ECS_CLUSTER: finbert-cluster

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"

      - name: Run Ruff
        run: uvx ruff==0.17.4 check app/ scripts/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: "starter/requirements.lock"

      - name: Install dependencies
        run: uv pip install --system --torch-backend cpu -r requirements.lock

      - name: Run integration tests
        env:
          MODEL_SOURCE: huggingface
          HF_MODEL_ID: baptle/FinBERT_market_based
        run: pytest tests/ -q
  deepchecks:
    runs-on: ubuntu-latest
    needs: lint

    env:
      MODEL_SOURCE: huggingface
      HF_MODEL_ID: baptle/FinBERT_market_based
      HF_DATASET_ID: baptle/financial_headlines_market_based

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: "starter/requirements.lock"

      - name: Install dependencies
        run: uv pip install --system --torch-backend cpu -r requirements.lock

      - name: Generate versioned datasets
        run: dvc repro

      - name: Run drift quality gate
        run: python scripts/run_deepchecks.py
  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: [test, deepchecks]

    outputs:
      image_tag: ${{ steps.build-image.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Build and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TIMESTAMP="$(date -u +%Y%m%d%H%M%S)"
          IMAGE_TAG="${SHORT_SHA}-${TIMESTAMP}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .

          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_DEFINITION}" \
            --query taskDefinition \
            > task-definition.json

      - name: Insert new image into task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1.9.0
        with:
          task-definition: starter/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.4
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

